# =============================================================================
#  accel_sim_h3.cfg -- Accel-Sim configuration enabling the H3 memory backend
# =============================================================================
#  USAGE
#      Append this file to a base GPU config so it overrides the memory
#      backend selection but changes nothing else:
#
#        accel-sim.out \
#            -config gpu-simulator/gpgpu-sim/configs/tested-cfgs/SM90_H100/gpgpusim.config \
#            -config configs/accel_sim_h3.cfg \
#            -trace traces/synthetic_h3_smoke_test/kernelslist.g
#
#      Option order matters: later -config files win, so this must come last.
#
#  WHAT IT CHANGES
#      Exactly one thing: the memory backend. Everything else -- SM count,
#      caches, clocks, interconnect -- comes from the base config, so an H3 run
#      and a baseline run differ only in the memory system. That is what makes
#      the comparison in scripts/run_smoke_test*.sh meaningful.
# =============================================================================

# ---- Select the H3 hybrid memory backend ------------------------------------
#   0 = default dram_t   1 = simple fixed-latency   2 = H3 (HBM + HBF + LHB)
-gpgpu_memory_backend 2
-gpgpu_h3_config_file configs/h3_backend_config.yaml

# ---- Keep the simulation tractable on a laptop ------------------------------
# perf_sim_memcpy walks each declared region in 32-byte steps. The synthetic
# trace declares only its touched footprint, so this is affordable; for large
# traces on a big machine, set it to 0.
-gpgpu_perf_sim_memcpy 1

# ---- Stats -------------------------------------------------------------------
# H3 counters are emitted in GPGPU-Sim's `key = value` style, so
# util/job_launching/get_stats.py collects them with no changes.
-gpgpu_runtime_stat 500
